name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.25"

      - name: Install locked package and dev tools
        run: uv sync --locked --all-extras

      - name: Run format checks
        run: |
          uv run --locked black --check .
          uv run --locked isort --check-only .

      - name: Run type checks
        run: |
          uv run --locked mypy src
          uv run --locked pyright

      - name: Run tests
        run: uv run --locked pytest

      - name: Build package
        run: |
          uv run --locked python -m build
          uv run --locked python -m twine check dist/*

  tests:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.25"

      - name: Install locked package and dev tools
        run: uv sync --locked --all-extras --python "${{ matrix.python-version }}"

      - name: Run locked tests
        run: uv run --locked --python "${{ matrix.python-version }}" pytest
